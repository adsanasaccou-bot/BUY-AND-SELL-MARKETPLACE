<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buyer Sign Up - Get and Buy Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      color: #123b67;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    .account-badge {
      width: fit-content;
      margin: 0 auto 22px;
      background: #e3f7ed;
      color: #087f5b;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background: white;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      background: #087f5b;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .signup-btn:hover {
      opacity: 0.9;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: white;
      color: #333;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-weight: bold;
    }

    .google-btn:hover {
      background: #f7f7f7;
    }

    .divider {
      text-align: center;
      margin: 22px 0;
      color: #888;
    }

    .login {
      text-align: center;
      margin-top: 22px;
    }

    .login a {
      color: #087f5b;
      text-decoration: none;
      font-weight: bold;
    }

    .seller-link {
      text-align: center;
      margin-top: 18px;
      padding: 14px;
      background: #f4f6f8;
      border-radius: 8px;
    }

    .seller-link p {
      margin: 0 0 8px;
      color: #555;
      font-size: 14px;
    }

    .seller-link a {
      color: #123b67;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #123b67;
      text-decoration: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h1 class="logo">
      Get and Buy
    </h1>

    <p class="subtitle">
      Create your buyer account
    </p>

    <div class="account-badge">
      Buyer Account
    </div>

    <form id="signupForm">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="country">
        Country
      </label>

      <select id="country" required>

        <option value="">
          Select your country
        </option>

        <option value="Pakistan">
          Pakistan
        </option>

        <option value="United States">
          United States
        </option>

        <option value="United Kingdom">
          United Kingdom
        </option>

        <option value="Canada">
          Canada
        </option>

        <option value="Australia">
          Australia
        </option>

        <option value="Germany">
          Germany
        </option>

        <option value="France">
          France
        </option>

        <option value="Italy">
          Italy
        </option>

        <option value="Other">
          Other
        </option>

      </select>

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <button
        class="signup-btn"
        type="submit">
        Create Buyer Account
      </button>

    </form>


    <div class="divider">
      OR
    </div>


    <button
      class="google-btn"
      id="googleSignup"
      type="button">
      Continue with Google
    </button>


    <div id="message"></div>


    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>


    <div class="seller-link">

      <p>
        Want to sell products?
      </p>

      <a href="seller-signup.html">
        Become a Seller
      </a>

    </div>


    <a
      class="back"
      href="index.html">
      ← Back to Home
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDgyL5BzzWdvdTv2Y8ZZo_LX2cIXE3SO-c",

      authDomain:
        "get-and-buy-marketplace.firebaseapp.com",

      projectId:
        "get-and-buy-marketplace",

      storageBucket:
        "get-and-buy-marketplace.firebasestorage.app",

      messagingSenderId:
        "67666978418",

      appId:
        "1:67666978418:web:f2618b9ac9c133ebdfc4eb",

      measurementId:
        "G-XTLMRGQBJM"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const provider =
      new GoogleAuthProvider();


    const message =
      document.getElementById("message");


    /*
      EMAIL + PASSWORD
      BUYER SIGNUP
    */

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const name =
            document
              .getElementById("name")
              .value
              .trim();

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const country =
            document
              .getElementById("country")
              .value;

          const password =
            document
              .getElementById("password")
              .value;


          message.textContent =
            "Creating your buyer account...";


          try {

            const userCredential =
              await createUserWithEmailAndPassword(
                auth,
                email,
                password
              );


            await updateProfile(
              userCredential.user,
              {
                displayName: name
              }
            );


            /*
              Buyer information is prepared
              for Firestore in the next step.
            */

            localStorage.setItem(
              "accountType",
              "Buyer"
            );

            localStorage.setItem(
              "country",
              country
            );


            message.textContent =
              "Buyer account created successfully!";


            setTimeout(
              function() {

                window.location.href =
                  "index.html";

              },
              1200
            );


          } catch (error) {

            message.textContent =
              "Sign up failed: " +
              error.message;

          }

        }
      );


    /*
      GOOGLE BUYER SIGNUP
    */

    document
      .getElementById("googleSignup")
      .addEventListener(
        "click",
        async function() {

          message.textContent =
            "Connecting to Google...";


          try {

            const result =
              await signInWithPopup(
                auth,
                provider
              );


            const user =
              result.user;


            /*
              Google users are Buyers
              on this page.
            */

            localStorage.setItem(
              "accountType",
              "Buyer"
            );


            message.textContent =
              "Google buyer account connected successfully!";


            setTimeout(
              function() {

                window.location.href =
                  "index.html";

              },
              1000
            );


          } catch (error) {

            if (
              error.code ===
              "auth/popup-closed-by-user"
            ) {

              message.textContent =
                "Google sign-in was cancelled.";

            } else {

              message.textContent =
                "Google sign up failed: " +
                error.message;

            }

          }

        }
      );

  </script>

</body>
</html>
