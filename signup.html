<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Get and Buy Marketplace</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
    .wrap{max-width:440px;margin:45px auto;padding:20px}
    .card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #15223b12}
    h1{text-align:center;font-size:27px;margin:0 0 8px}
    .sub{text-align:center;color:#667085;line-height:1.5;margin-bottom:24px}
    label{display:block;font-weight:600;margin:15px 0 7px}
    input{width:100%;padding:13px;border:1px solid #d7deea;border-radius:9px;font-size:16px}
    button{width:100%;padding:13px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
    .primary{background:#2563eb;color:white}
    .google{background:#fff;border:1px solid #d7deea;color:#172033}
    button:disabled{opacity:.6;cursor:wait}
    .message{font-size:14px;line-height:1.5;margin-top:14px;overflow-wrap:anywhere}
    .links{text-align:center;margin-top:20px;line-height:1.8}
    a{color:#2563eb;text-decoration:none}
    .note{font-size:13px;color:#667085;text-align:center;margin-top:20px;line-height:1.5}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Join Get and Buy</h1>
      <p class="sub">Create one account to buy products and sell your own items.</p>

      <form id="signupForm">
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" required maxlength="80" placeholder="Enter your full name">

        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters">

        <button class="primary" id="signupBtn" type="submit">Create My Account</button>
      </form>

      <button class="google" id="googleBtn" type="button">Continue with Google</button>
      <p id="message" class="message" role="status"></p>

      <div class="links">
        Already have an account? <a href="login.html">Log in</a><br>
        <a href="index.html">Back to Marketplace</a>
      </div>
      <p class="note">One account for both buying and selling. You do not need separate Buyer and Seller accounts.</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, updateProfile,
      GoogleAuthProvider, signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgyL5BzzWdvdTv2Y8ZZo_LX2cIXE3SO-c",
      authDomain: "get-and-buy-marketplace.firebaseapp.com",
      projectId: "get-and-buy-marketplace",
      storageBucket: "get-and-buy-marketplace.firebasestorage.app",
      messagingSenderId: "67666978418",
      appId: "1:67666978418:web:f2618b9ac9c133ebdfc4eb",
      measurementId: "G-XTLMRGQBJM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const form = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const googleBtn = document.getElementById("googleBtn");
    const message = document.getElementById("message");

    function showMessage(text, isError = true) {
      message.textContent = text;
      message.style.color = isError ? "#b42318" : "#087443";
    }

    async function saveMember(user, name = "") {
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        name: name || user.displayName || "",
        email: user.email || "",
        photoURL: user.photoURL || "",
        accountType: "Buyer & Seller",
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      signupBtn.disabled = true;
      googleBtn.disabled = true;
      showMessage("Creating your account...", false);

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(result.user, { displayName: name });
        await saveMember(result.user, name);
        window.location.href = "profile.html";
      } catch (error) {
        console.error(error);
        const messages = {
          "auth/email-already-in-use": "This email already has an account. Please log in instead.",
          "auth/invalid-email": "Please enter a valid email address.",
          "auth/weak-password": "Please use a stronger password with at least 6 characters.",
          "auth/network-request-failed": "Network error. Check your internet connection and try again.",
          "permission-denied": "Your account may have been created, but Firestore permissions need to be configured. Do not create another account; share this error."
        };
        showMessage(messages[error.code] || error.message || "Could not create the account. Please try again.");
      } finally {
        signupBtn.disabled = false;
        googleBtn.disabled = false;
      }
    });

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      signupBtn.disabled = true;
      showMessage("Connecting to Google...", false);

      try {
        const result = await signInWithPopup(auth, provider);
        await saveMember(result.user);
        window.location.href = "profile.html";
      } catch (error) {
        console.error(error);
        showMessage(error.message || "Google sign-in failed. Please try again.");
      } finally {
        googleBtn.disabled = false;
        signupBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
