<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Get and Buy Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      color: #123b67;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #087f5b;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: white;
      color: #333;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-weight: bold;
    }

    .divider {
      text-align: center;
      margin: 22px 0;
      color: #888;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
    }

    .signup a {
      color: #087f5b;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #123b67;
      text-decoration: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1 class="logo">Get and Buy</h1>

    <p class="subtitle">
      Login to your marketplace account
    </p>

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button
        class="login-btn"
        type="submit">
        Login
      </button>

    </form>

    <div class="divider">
      OR
    </div>

    <button
      class="google-btn"
      id="googleLogin">
      Continue with Google
    </button>

    <div id="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

    <a
      class="back"
      href="index.html">
      ← Back to Home
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDgyL5BzzWdvdTv2Y8ZZo_LX2cIXE3SO-c",

      authDomain: "get-and-buy-marketplace.firebaseapp.com",

      projectId: "get-and-buy-marketplace",

      storageBucket: "get-and-buy-marketplace.firebasestorage.app",

      messagingSenderId: "67666978418",

      appId: "1:67666978418:web:f2618b9ac9c133ebdfc4eb",

      measurementId: "G-XTLMRGQBJM"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    const message = document.getElementById("message");


    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        message.textContent = "Logging in...";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          message.textContent =
            "Login successful!";

          setTimeout(function() {

            window.location.href =
              "index.html";

          }, 1000);

        } catch (error) {

          message.textContent =
            "Login failed: " + error.message;

        }

      });


    document
      .getElementById("googleLogin")
      .addEventListener("click", async function() {

        message.textContent =
          "Connecting to Google...";

        try {

          await signInWithPopup(
            auth,
            provider
          );

          message.textContent =
            "Google login successful!";

          setTimeout(function() {

            window.location.href =
              "index.html";

          }, 1000);

        } catch (error) {

          message.textContent =
            "Google login failed: " +
            error.message;

        }

      });

  </script>

</body>
</html>
