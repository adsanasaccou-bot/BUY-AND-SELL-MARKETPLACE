<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Get and Buy Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      color: #123b67;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #087f5b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .google-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: white;
      color: #333;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .divider {
      text-align: center;
      margin: 22px 0;
      color: #888;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
    }

    .signup a {
      color: #087f5b;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #123b67;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1 class="logo">Get and Buy</h1>

    <p class="subtitle">Login to your marketplace account</p>

    <form onsubmit="loginUser(event)">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button class="login-btn" type="submit">
        Login
      </button>

    </form>

    <div class="divider">OR</div>

    <button class="google-btn" onclick="googleLogin()">
      Continue with Google
    </button>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Sign Up</a>
    </div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </div>

  <script>
    function loginUser(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;

      alert(
        "Login page is ready! Real account authentication will be connected next."
      );
    }

    function googleLogin() {
      alert(
        "Google Login will be connected with Firebase in the next step."
      );
    }
  </script>

</body>
</html>
